        // --- 카테고리 탭 데이터 ---
        const CATEGORIES = [
            { id: 'drip', label: '브루잉(드립)' },
            { id: 'mokapot', label: '모카포트' },
            { id: 'espresso', label: '에스프레소' },
            { id: 'capsule', label: '캡슐' }
        ];

        // --- 메인 앱 컴포넌트 ---
        const BrewingGuide = () => {
            const [categoryFilter, setCategoryFilter] = useState('drip');
            const [roastFilter, setRoastFilter] = useState('all'); // all, light, medium, dark
            const [tempFilter, setTempFilter] = useState('all');   // all, hot, ice
            const [dripperFilter, setDripperFilter] = useState('all'); // all, v60, kalita, etc
            const [selectedRecipe, setSelectedRecipe] = useState(null); 

            // 필터링 로직: Category, Roast, Temp, Dripper 독립 체크
            const filteredRecipes = useMemo(() => {
                return allRecipes.filter(item => {
                    const categoryMatch = item.category === categoryFilter;
                    const roastMatch = roastFilter === 'all' || item.roast === 'all' || item.roast === roastFilter;
                    const tempMatch = tempFilter === 'all' || item.type === tempFilter;
                    
                    let dripperMatch = true;
                    if (categoryFilter === 'drip' && dripperFilter !== 'all') {
                        dripperMatch = item.dripperType === dripperFilter;
                    }

                    return categoryMatch && roastMatch && tempMatch && dripperMatch;
                });
            }, [categoryFilter, roastFilter, tempFilter, dripperFilter]);

            // 필터 버튼 스타일
            const FilterButton = ({ label, value, current, onClick, activeColor }) => (
                <button 
                    onClick={() => onClick(value)}
                    className={`flex-1 py-2 rounded-lg text-xs md:text-sm font-bold transition-all duration-200 border ${
                        current === value 
                        ? `${activeColor} text-white shadow-md border-transparent` 
                        : 'bg-stone-800 text-stone-400 border-stone-700 hover:bg-stone-700 hover:text-stone-200'
                    }`}
                >
                    {label}
                </button>
            );

            // 로스팅 뱃지 스타일
            const getRoastBadgeStyle = (roast) => {
                switch(roast) {
                    case 'light': return "bg-orange-900/30 text-orange-400 border-orange-800/50";
                    case 'medium': return "bg-amber-900/30 text-amber-400 border-amber-800/50";
                    case 'dark': return "bg-stone-700/50 text-stone-300 border-stone-600";
                    default: return "bg-blue-900/30 text-blue-400 border-blue-800/50"; 
                }
            };
            
            const getRoastLabel = (roast) => {
                switch(roast) {
                    case 'light': return "약배전";
                    case 'medium': return "중배전";
                    case 'dark': return "강배전";
                    default: return "All";
                }
            };

            // Modal Scroll Lock
            useEffect(() => {
                if(selectedRecipe) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = 'auto';
            }, [selectedRecipe]);

            return (
                <div className="pb-20">
                    {/* Header */}
                    <header className="fixed top-0 w-full z-10 bg-stone-900/80 backdrop-blur-md border-b border-stone-800 shadow-sm">
                        <div className="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="p-2 rounded-lg bg-gradient-to-br from-amber-600 to-orange-800 text-white shadow-lg">
                                    <Icon name="Coffee" size={20} />
                                </div>
                                <h1 className="text-xl font-bold text-stone-100 tracking-tight">MY COFFEE RECIPIE</h1>
                            </div>
                            <div className="text-xs font-medium text-stone-400 bg-stone-800 px-3 py-1 rounded-full border border-stone-700">Pro Ver.</div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-6 pt-24">
                        
                        {/* Categories Tab */}
                        <div className="flex overflow-x-auto scrollbar-hide gap-2 mb-6 pb-2">
                            {CATEGORIES.map(cat => (
                                <button
                                    key={cat.id}
                                    onClick={() => setCategoryFilter(cat.id)}
                                    className={`whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all duration-200 border ${
                                        categoryFilter === cat.id
                                        ? 'bg-amber-700 text-white shadow-md border-transparent'
                                        : 'bg-stone-800 text-stone-400 border-stone-700 hover:bg-stone-700 hover:text-stone-200'
                                    }`}
                                >
                                    {cat.label}
                                </button>
                            ))}
                        </div>

                        {/* Filters Section */}
                        <div className="mb-8 space-y-4">
                            {/* Dripper Filter (Drip 카테고리일 때만 표시) */}
                            {categoryFilter === 'drip' && (
                                <div className="bg-stone-800 p-2 rounded-xl shadow-sm border border-stone-700 animate-fade-in">
                                    <div className="flex items-center gap-2 mb-2 px-1">
                                        <Icon name="Filter" size={14} className="text-stone-500"/>
                                        <span className="text-xs font-bold text-stone-400 uppercase tracking-wider">Dripper Type</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <FilterButton label="전체" value="all" current={dripperFilter} onClick={setDripperFilter} activeColor="bg-stone-600" />
                                        <FilterButton label="V60" value="v60" current={dripperFilter} onClick={setDripperFilter} activeColor="bg-amber-700" />
                                        <FilterButton label="칼리타" value="kalita" current={dripperFilter} onClick={setDripperFilter} activeColor="bg-amber-700" />
                                        <FilterButton label="대형/기타" value="etc" current={dripperFilter} onClick={setDripperFilter} activeColor="bg-amber-700" />
                                    </div>
                                </div>
                            )}

                            {/* Roast Filter */}
                            <div className="bg-stone-800 p-2 rounded-xl shadow-sm border border-stone-700">
                                <div className="flex items-center gap-2 mb-2 px-1">
                                    <Icon name="Filter" size={14} className="text-stone-500"/>
                                    <span className="text-xs font-bold text-stone-400 uppercase tracking-wider">Roast Level</span>
                                </div>
                                <div className="flex gap-2">
                                    <FilterButton label="전체" value="all" current={roastFilter} onClick={setRoastFilter} activeColor="bg-stone-600" />
                                    <FilterButton label="라이트" value="light" current={roastFilter} onClick={setRoastFilter} activeColor="bg-orange-600" />
                                    <FilterButton label="미디엄" value="medium" current={roastFilter} onClick={setRoastFilter} activeColor="bg-amber-600" />
                                    <FilterButton label="다크" value="dark" current={roastFilter} onClick={setRoastFilter} activeColor="bg-stone-500" />
                                </div>
                            </div>

                            {/* Temp Filter */}
                            <div className="bg-stone-800 p-2 rounded-xl shadow-sm border border-stone-700">
                                <div className="flex items-center gap-2 mb-2 px-1">
                                    <Icon name="Thermometer" size={14} className="text-stone-500"/>
                                    <span className="text-xs font-bold text-stone-400 uppercase tracking-wider">Temperature</span>
                                </div>
                                <div className="flex gap-2">
                                    <FilterButton label="전체" value="all" current={tempFilter} onClick={setTempFilter} activeColor="bg-stone-600" />
                                    <FilterButton label="HOT" value="hot" current={tempFilter} onClick={setTempFilter} activeColor="bg-red-800/80" />
                                    <FilterButton label="ICE" value="ice" current={tempFilter} onClick={setTempFilter} activeColor="bg-blue-800/80" />
                                </div>
                            </div>
                        </div>

                        {/* Title & Count */}
                        <div className="mb-6 flex justify-between items-end border-b border-stone-800 pb-2">
                            <h2 className="text-2xl font-bold text-stone-100">Recipes</h2>
                            <span className="text-sm font-medium text-stone-400 mb-1">{filteredRecipes.length} found</span>
                        </div>

                        {/* Recipe Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 animate-fade-in">
                            {filteredRecipes.length > 0 ? (
                                filteredRecipes.map((item) => (
                                    <div key={item.id} 
                                         onClick={() => setSelectedRecipe(item)}
                                         className="group bg-stone-800 rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.2)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.4)] transition-all duration-300 hover:scale-[1.01] border border-stone-700 cursor-pointer relative overflow-hidden"
                                    >
                                        {/* Header Row */}
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex gap-1.5">
                                                <span className={`px-2.5 py-1 text-[10px] font-bold border rounded-full ${getRoastBadgeStyle(item.roast)}`}>
                                                    {getRoastLabel(item.roast)}
                                                </span>
                                                <span className={`px-2.5 py-1 text-[10px] font-bold border rounded-full ${item.type === 'hot' ? 'bg-red-900/30 text-red-400 border-red-800/50' : 'bg-blue-900/30 text-blue-400 border-blue-800/50'}`}>
                                                    {item.type === 'hot' ? 'HOT' : 'ICE'}
                                                </span>
                                            </div>
                                            <span className="text-[10px] font-medium text-stone-500 uppercase tracking-wider">{item.tag}</span>
                                        </div>

                                        <h3 className="text-lg font-bold text-stone-100 mb-2 group-hover:text-amber-500 transition-colors flex items-center gap-2">
                                            {item.title}
                                        </h3>
                                        
                                        {/* Grinder & Dripper Info */}
                                        <div className="flex flex-col gap-1.5 mb-4 text-xs text-stone-400">
                                            <div className="flex items-center gap-2">
                                                <Icon name="Grinder" size={14} className="text-amber-500/80" />
                                                <span className="truncate">{item.grinderSetting}</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <Icon name="Filter" size={14} className="text-amber-500/80" />
                                                <span className="truncate">{item.dripper}</span>
                                            </div>
                                        </div>
                                        
                                        {/* Info Row */}
                                        <div className="flex items-center justify-between text-xs font-medium text-stone-300 bg-stone-900/50 px-3 py-3 rounded-xl mb-4 border border-stone-700/50">
                                            <div className="flex items-center gap-1.5"><Icon name="Scale" size={14} className="text-stone-400"/> {item.bean}</div>
                                            <div className="w-px h-3 bg-stone-700"></div>
                                            <div className="flex items-center gap-1.5"><Icon name="Droplets" size={14} className="text-stone-400"/> {item.waterAmount}</div>
                                            <div className="w-px h-3 bg-stone-700"></div>
                                            <div className="flex items-center gap-1.5"><Icon name="Thermometer" size={14} className="text-stone-400"/> {item.tempOverride}</div>
                                        </div>

                                        {/* Note */}
                                        {item.note && (
                                            <div className="bg-amber-900/20 border border-amber-900/50 text-amber-200/90 text-xs px-3 py-2 rounded-lg flex items-start gap-2">
                                                <span className="font-bold text-amber-500 shrink-0">Check!</span>
                                                <span className="opacity-90 line-clamp-1">{item.note}</span>
                                            </div>
                                        )}
                                    </div>
                                ))
                            ) : (
                                <div className="col-span-full text-center py-20 text-stone-500">
                                    <p>조건에 맞는 레시피가 없습니다.</p>
                                    <button onClick={() => {setRoastFilter('all'); setTempFilter('all'); setDripperFilter('all');}} className="mt-4 text-sm text-amber-500 hover:underline">필터 초기화</button>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Detail Modal */}
                    {selectedRecipe && (
                        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={() => setSelectedRecipe(null)}></div>
                            <div className="relative w-full md:max-w-lg bg-stone-800 rounded-t-3xl md:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto animate-fade-in scrollbar-hide border border-stone-700">
                                {/* Header */}
                                <div className={`sticky top-0 z-10 px-6 py-4 bg-gradient-to-r ${selectedRecipe.type === 'hot' ? 'from-amber-700 to-orange-800' : 'from-slate-700 to-stone-800'} text-white flex justify-between items-center shadow-md`}>
                                    <div>
                                        <h3 className="font-bold text-lg">{selectedRecipe.title}</h3>
                                        <p className="text-white/80 text-xs flex items-center gap-2 mt-0.5">
                                            <span className="bg-black/20 px-1.5 py-0.5 rounded text-[10px]">{getRoastLabel(selectedRecipe.roast)}</span>
                                            <span>{selectedRecipe.bean} · {selectedRecipe.waterAmount}</span>
                                        </p>
                                    </div>
                                    <button onClick={() => setSelectedRecipe(null)} className="p-2 bg-black/20 rounded-full hover:bg-black/40 transition text-white">
                                        <Icon name="Close" size={20} />
                                    </button>
                                </div>

                                {/* Body */}
                                <div className="p-6 space-y-6">
                                    {/* Info Grid */}
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="bg-stone-900/50 rounded-xl p-3 flex flex-col items-center justify-center gap-1 border border-stone-700">
                                            <Icon name="Scale" size={16} className="text-stone-400"/>
                                            <span className="text-xs text-stone-400">원두량</span>
                                            <span className="font-bold text-sm text-stone-200">{selectedRecipe.bean}</span>
                                        </div>
                                        <div className="bg-stone-900/50 rounded-xl p-3 flex flex-col items-center justify-center gap-1 border border-stone-700">
                                            <Icon name="Thermometer" size={16} className={selectedRecipe.type === 'hot' ? 'text-red-400' : 'text-blue-400'}/>
                                            <span className="text-xs text-stone-400">물 온도</span>
                                            <span className="font-bold text-sm text-stone-200">{selectedRecipe.tempOverride}</span>
                                        </div>
                                        <div className="bg-stone-900/50 rounded-xl p-3 flex flex-col items-center justify-center gap-1 border border-stone-700">
                                            <Icon name="Grinder" size={16} className="text-stone-400"/>
                                            <span className="text-xs text-stone-400">분쇄도 세팅</span>
                                            <span className="font-bold text-[13px] text-stone-200 text-center leading-tight">{selectedRecipe.grinderSetting}</span>
                                        </div>
                                        <div className="bg-stone-900/50 rounded-xl p-3 flex flex-col items-center justify-center gap-1 border border-stone-700">
                                            <Icon name="Filter" size={16} className="text-stone-400"/>
                                            <span className="text-xs text-stone-400">추천 도구</span>
                                            <span className="font-bold text-[13px] text-stone-200 text-center leading-tight">{selectedRecipe.dripper}</span>
                                        </div>
                                    </div>

                                    {/* Note */}
                                    {selectedRecipe.note && (
                                        <div className="bg-amber-900/20 border border-amber-800/50 text-amber-200 text-sm px-4 py-3 rounded-xl flex items-start gap-2 shadow-sm">
                                            <span className="font-bold text-amber-500 shrink-0">Check!</span>
                                            <span className="leading-relaxed">{selectedRecipe.note}</span>
                                        </div>
                                    )}

                                    {/* YouTube Link */}
                                    {selectedRecipe.youtubeUrl ? (
                                        <a href={selectedRecipe.youtubeUrl} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full py-3.5 bg-red-600/90 hover:bg-red-600 text-white font-bold rounded-xl transition shadow-lg shadow-red-900/20 mt-2">
                                            <Icon name="Youtube" size={20}/>
                                            유튜브 원본 영상 보기
                                        </a>
                                    ) : (
                                        <div className="flex items-center justify-center gap-2 w-full py-3.5 bg-stone-700/50 text-stone-500 font-bold rounded-xl mt-2 cursor-not-allowed border border-stone-700">
                                            <Icon name="Youtube" size={20}/>
                                            유튜브 정보 없음
                                        </div>
                                    )}

                                    {/* Timeline */}
                                    <div>
                                        <h4 className="font-bold text-stone-200 flex items-center gap-2 text-sm mb-4">
                                            <Icon name="Clock" size={18} className="text-amber-500"/> BREWING PROCESS
                                        </h4>
                                        <div className="space-y-0">
                                            {selectedRecipe.timeline.map((step, idx) => (
                                                <div key={idx} className="flex justify-between items-center py-3 border-b border-stone-700 last:border-0 hover:bg-stone-700/30 px-2 rounded-lg transition-colors">
                                                    <span className="font-mono text-stone-400 text-sm font-medium">{step.time}</span>
                                                    <span className="font-bold text-stone-200 text-base">{step.action}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {/* Footer */}
                                    <div className="pt-4 mt-2 border-t-2 border-dashed border-stone-700 space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-stone-400 text-sm flex items-center gap-2"><Icon name="Droplets" size={16}/> 총 투입량</span>
                                            <span className="font-bold text-lg text-stone-100">{selectedRecipe.totalWater}</span>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="text-stone-400 text-sm flex items-center gap-2"><Icon name="Coffee" size={16}/> 마무리</span>
                                            <span className="font-bold text-sm text-stone-200 text-right">{selectedRecipe.finish}</span>
                                        </div>
                                    </div>

                                    <button onClick={() => setSelectedRecipe(null)} className="w-full py-4 bg-stone-700 text-stone-300 font-bold rounded-xl hover:bg-stone-600 transition">
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BrewingGuide />);
    </script>
</body>
</html>
